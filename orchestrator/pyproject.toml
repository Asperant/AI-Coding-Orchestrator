[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-orchestrator"
version = "0.1.0"
description = "Local read-only skeleton for the AI Coding Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
orchestrator = "main:main"
ai-coding-orchestrator = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["brain*", "core*", "orchestration*", "project*", "tools*"]
namespaces = true
